name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  database-and-e2e:
    name: Migrations, RLS tests, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase (db, auth, api, mail)
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Lint migrations
        run: pnpm exec supabase db lint --level warning --fail-on error

      - name: pgTAP (schema, RLS isolation, ledger integrity)
        run: pnpm exec supabase test db

      - name: Generated types are up to date
        run: |
          pnpm exec supabase gen types typescript --db-url "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --schema public > /tmp/database.types.ts
          pnpm exec prettier --stdin-filepath apps/web/src/lib/database.types.ts < /tmp/database.types.ts > /tmp/database.types.formatted.ts
          diff -u apps/web/src/lib/database.types.ts /tmp/database.types.formatted.ts \
            || (echo "::error::Run 'pnpm --filter @mohar/web db:types' and commit the result" && exit 1)

      - name: Export local Supabase env
        run: |
          status=$(pnpm exec supabase status -o json)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' <<<"$status")"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY' <<<"$status")"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY' <<<"$status")"
            echo "APP_BASE_URL=http://localhost:3000"
            echo "NOTE_URL_PREFIX=https://sirhindmohar.in/n/"
          } >> "$GITHUB_ENV"

      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm e2e
        env:
          E2E_SUPABASE: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
